<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作管理平台</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>工作管理平台</h1>
  <nav class="tabs">
    <button class="tab active" data-view="tasks">任务</button>
    <button class="tab" data-view="report">日报</button>
  </nav>
  <div class="actions">
    <button id="btn-export" class="btn ghost" title="导出全部数据为 JSON">导出备份</button>
    <button id="btn-import" class="btn ghost" title="从 JSON 文件导入">导入</button>
    <input type="file" id="file-import" accept="application/json" hidden />
  </div>
</header>

<!-- 站内提醒（列表形式补推） -->
<div id="reminder-banner" class="reminder-banner hidden">
  <div class="reminder-head">
    <span id="reminder-count"></span>
    <button id="reminder-close" class="btn tiny ghost">收起</button>
  </div>
  <ul id="reminder-list"></ul>
</div>

<main>
  <!-- ============ 任务视图 ============ -->
  <section id="view-tasks" class="view active">
    <div class="toolbar">
      <h2>任务列表</h2>
      <button id="btn-new-task" class="btn primary">+ 新建任务</button>
    </div>
    <div id="task-list" class="task-list"></div>
    <p id="task-empty" class="empty hidden">还没有任务，点击右上角「新建任务」开始。</p>
  </section>

  <!-- ============ 日报视图 ============ -->
  <section id="view-report" class="view">
    <div class="toolbar">
      <h2>每日日报</h2>
      <div class="date-pick">
        <label>日期</label>
        <input type="date" id="report-date" />
      </div>
    </div>
    <div class="report-layout">
      <div class="report-main">
        <label class="field-label">今日工作内容（手写）</label>
        <textarea id="report-content" placeholder="详细记录今天做了什么……（可切换到任意历史日期修改）"></textarea>
        <div class="report-main-footer">
          <span id="report-status" class="muted"></span>
          <button id="btn-save-report" class="btn primary">保存日报</button>
        </div>
      </div>
      <aside class="report-side">
        <h3>今日任务汇总</h3>
        <p class="muted small">系统按「实际活动日期」自动汇总</p>
        <div id="report-summary"></div>
      </aside>
    </div>
  </section>
</main>

<!-- ============ 任务编辑弹窗 ============ -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title">新建任务</h2>

    <label class="field-label">任务标题 *</label>
    <input id="f-title" type="text" placeholder="例如：完成季度报告" />

    <label class="field-label">详细描述</label>
    <textarea id="f-desc" rows="2" placeholder="补充说明"></textarea>

    <div class="grid2">
      <div>
        <label class="field-label">截止时间</label>
        <input id="f-deadline" type="datetime-local" />
      </div>
      <div>
        <label class="field-label">计划开始时间</label>
        <input id="f-plan-start" type="datetime-local" />
      </div>
    </div>

    <div class="grid2">
      <div>
        <label class="field-label">计划结束时间</label>
        <input id="f-plan-end" type="datetime-local" />
        <div class="hint-row">
          <span class="muted small">或按预估工时自动推算：</span>
          <input id="f-est-hours" type="number" min="0" step="0.5" placeholder="小时" style="max-width:80px" />
          <button type="button" id="btn-calc-plan" class="btn tiny ghost">推算</button>
        </div>
      </div>
      <div>
        <label class="field-label">状态</label>
        <select id="f-status">
          <option>未开始</option>
          <option>进行中</option>
          <option>已完成</option>
        </select>
      </div>
    </div>

    <label class="field-label">提醒点（可多个）</label>
    <div id="reminder-rows"></div>
    <button type="button" id="btn-add-reminder" class="btn tiny ghost">+ 添加提醒点</button>

    <div class="modal-footer">
      <button id="btn-delete" class="btn danger hidden">删除任务</button>
      <div class="spacer"></div>
      <button id="btn-cancel" class="btn ghost">取消</button>
      <button id="btn-save" class="btn primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
